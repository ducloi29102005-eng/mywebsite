<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Khoản Bị Khóa | Panthera Games</title>

    <!-- CSRF Token để hỗ trợ Logout POST -->
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff5a00;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --bg-dark: #07080a;
            --surface: #14171f;
            --surface-elevated: #1b1f2a;
            --border: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; position: relative;
            background-image: radial-gradient(circle at 50% -20%, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
        }

        /* KHUNG CẢNH BÁO */
        .banned-card {
            background: rgba(20, 23, 31, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 50px 48px;
            width: 100%;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: fadeUp 0.5s ease-out;
        }

        /* Viền trên màu đỏ */
        .banned-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--danger), transparent);
            border-radius: 24px 24px 0 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LOGO */
        .brand-logo {
            display: inline-flex; align-items: center; gap: 12px; text-decoration: none;
            color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 1px;
            margin-bottom: 35px;
        }
        .brand-logo img {
            width: 44px; height: 44px; border-radius: 12px; object-fit: cover;
            border: 2px solid var(--border-light);
        }
        .brand-logo span { color: var(--primary); }

        /* ICON CẢNH BÁO */
        .alert-icon {
            width: 72px; height: 72px; margin: 0 auto 20px;
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: var(--danger); box-shadow: 0 0 20px var(--danger-glow);
        }

        /* TIÊU ĐỀ */
        .banned-title {
            margin: 0 0 10px 0; font-size: 28px; font-weight: 900;
            color: #fff; letter-spacing: -0.5px; text-transform: uppercase;
        }

        .account-label {
            font-size: 14.5px; color: var(--text-secondary); margin-bottom: 30px; font-weight: 500;
        }
        .account-label span {
            color: #fff; font-weight: 700; background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px; border-radius: 6px; margin-left: 6px; border: 1px solid var(--border);
        }

        /* HỘP LÝ DO */
        .reason-box {
            background: var(--bg-dark); border: 1px solid var(--border);
            border-left: 4px solid var(--danger); border-radius: 12px;
            padding: 20px 24px; text-align: left; margin-bottom: 40px;
        }
        .reason-header {
            font-size: 11.5px; font-weight: 800; color: var(--danger);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }
        .reason-text {
            font-size: 14.5px; font-weight: 500; color: var(--text-secondary); line-height: 1.6;
            margin: 0;
        }

        /* NÚT ĐĂNG XUẤT (FORM POST) */
        .action-form { margin: 0; width: 100%; }

        .btn-logout {
            width: 100%; background: var(--surface-elevated); color: #fff;
            border: 1px solid var(--border-light); padding: 16px; border-radius: 12px;
            font-size: 14.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.25s ease; font-family: inherit;
        }
        .btn-logout:hover {
            background: var(--danger); border-color: var(--danger); color: #fff;
            transform: translateY(-2px); box-shadow: 0 8px 20px var(--danger-glow);
        }

        .footer-note {
            margin-top: 24px; font-size: 13px; color: var(--text-muted); font-weight: 500;
        }
        .footer-note a { color: var(--text-secondary); text-decoration: underline; transition: 0.2s; }
        .footer-note a:hover { color: #fff; }

    </style>
</head>
<body>

<div class="banned-card">

    <!-- Logo Panthera (Đồng bộ) -->
    <a href="#" class="brand-logo">
        <img th:src="@{/images/logo.jpg}" alt="Panthera Logo" onerror="this.src='https://placehold.co/100x100/ff5a00/ffffff?text=P'">
        <div>PANTHERA<span>.GAMES</span></div>
    </a>

    <!-- Icon Cảnh báo -->
    <div class="alert-icon">⚠️</div>

    <!-- Tiêu đề -->
    <h1 class="banned-title">Tài Khoản Bị Khóa</h1>

    <!-- Thông tin định danh -->
    <div class="account-label">
        Mã định danh Panthera ID: <span th:text="${username}">username</span>
    </div>

    <!-- Khung lý do vi phạm -->
    <div class="reason-box">
        <div class="reason-header">THÔNG BÁO TỪ HỆ THỐNG</div>
        <p class="reason-text" th:text="${reason != null ? reason : 'Tài khoản của bạn đã bị khóa quyền truy cập do phát hiện các hành vi vi phạm Điều khoản Dịch vụ và Tiêu chuẩn Cộng đồng của hệ thống.'}">
            Lý do sẽ hiển thị ở đây
        </p>
    </div>

    <!-- Nút Đăng xuất dùng FORM POST chống lỗi 404 -->
    <form th:action="@{/logout}" method="post" class="action-form">
        <button type="submit" class="btn-logout">
            Đăng Xuất Khỏi Hệ Thống
        </button>
    </form>

    <div class="footer-note">
        Bạn cho rằng đây là một sự nhầm lẫn? <a href="#">Liên hệ đội ngũ hỗ trợ</a>
    </div>

</div>

</body>
</html>
