<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài Khoản Bị Khóa | Panthera</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Hiệu ứng rung giật / động đậy cho chữ BANNED */
        @keyframes pulseShake {
            0% {
                transform: scale(1) translate(0, 0);
                text-shadow: 0 0 25px rgba(255, 30, 30, 0.6);
            }
            20% {
                transform: scale(1.02) translate(-1px, 1px);
                text-shadow: 0 0 35px rgba(255, 42, 42, 0.9);
            }
            40% {
                transform: scale(0.99) translate(1px, -1px);
                text-shadow: 0 0 20px rgba(255, 20, 20, 0.5);
            }
            60% {
                transform: scale(1.03) translate(-2px, -1px);
                text-shadow: 0 0 40px rgba(255, 50, 50, 1);
            }
            80% {
                transform: scale(1.01) translate(1px, 1px);
                text-shadow: 0 0 30px rgba(255, 30, 30, 0.7);
            }
            100% {
                transform: scale(1) translate(0, 0);
                text-shadow: 0 0 25px rgba(255, 30, 30, 0.6);
            }
        }

        .banned-title {
            color: #ff2a2a;
            font-size: 96px;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            user-select: none;
            /* Kích hoạt chuyển động liên tục */
            animation: pulseShake 1.8s infinite ease-in-out;
        }

        .account-label {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .reason-box {
            background-color: #141414;
            border: 1px solid #222222;
            border-left: 4px solid #ff2a2a;
            border-radius: 8px;
            padding: 16px 24px;
            width: 100%;
            max-width: 580px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        .btn-logout {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #2a2a2a;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background-color: #252525;
            border-color: #3a3a3a;
        }
    </style>
</head>
<body>

<!-- Chỉ duy nhất dòng này chuyển động rung lắc và phát sáng -->
<h1 class="banned-title">BANNED</h1>

<!-- Tên tài khoản -->
<div class="account-label">
    Tài khoản: <span style="font-weight: bold;" th:text="${username}"></span>
</div>

<!-- Khung lý do: Tự động đổi nội dung nếu có truyền reason, không thì giữ chữ mặc định -->
<div class="reason-box" th:text="${reason != null ? reason : 'Tài khoản của bạn đã bị khóa do vi phạm chính sách tiêu chuẩn cộng đồng.'}">
    LÝ DO BỊ KHÓA
</div>

<!-- Nút Đăng xuất tĩnh -->
<a th:href="@{/login}" class="btn-logout">Đăng xuất</a>

</body>
</html>
