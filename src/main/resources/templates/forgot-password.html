<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu | Panthera</title>
    <style>
        body {
            margin: 0; background-color: #050505; color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .auth-card {
            background: #121212; border: 1px solid #2a2a2a; border-radius: 16px;
            padding: 40px; width: 100%; max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
        }

        /* Cấu hình Logo hình tròn và Tên thương hiệu */
        .logo-container { margin-bottom: 25px; }
        .logo {
            width: 100px; height: 100px;
            border-radius: 50%; /* Ép logo thành hình tròn */
            object-fit: cover;
            border: 2px solid #d4af37; /* Viền vàng hoàng gia */
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .brand-name {
            font-size: 24px; font-weight: bold; color: #d4af37;
            letter-spacing: 3px; text-transform: uppercase; margin: 0;
        }

        .page-title { font-size: 18px; margin-bottom: 8px; color: #eee; font-weight: 600; }
        .instruction { font-size: 13px; color: #888; margin-bottom: 25px; line-height: 1.5; }

        .alert-error {
            padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;
            background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333;
            color: #fff; border-radius: 8px; box-sizing: border-box; transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }

        .btn-submit {
            width: 100%; padding: 15px; background: #d4af37; color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background: #e5c048; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        .footer-link { margin-top: 25px; font-size: 14px; color: #888; }
        .footer-link a { color: #d4af37; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .footer-link a:hover { text-shadow: 0 0 8px rgba(212, 175, 55, 0.5); }
    </style>
</head>
<body>
<div class="auth-card">

    <!-- Logo tròn và Tên thương hiệu Panthera -->
    <div class="logo-container">
        <img th:src="@{/images/logo.jpg}" alt="Panthera Logo" class="logo">
        <h1 class="brand-name">Panthera</h1>
    </div>

    <div class="page-title">QUÊN MẬT KHẨU</div>
    <p class="instruction">Nhập email tài khoản của bạn để nhận mã OTP xác thực.</p>

    <!-- Thông báo lỗi (VD: Email không tồn tại) -->
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="input-group">
            <label>Địa chỉ Email</label>
            <input type="email" name="email" placeholder="Nhập email của bạn..." required>
        </div>
        <button type="submit" class="btn-submit">Gửi mã OTP</button>
    </form>

    <div class="footer-link">
        Nhớ ra mật khẩu? <a th:href="@{/login}">Quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
