<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Panthera Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5a00;
            --primary-glow: rgba(255, 90, 0, 0.5);
            --bg-dark: #050608;
            --surface: rgba(14, 16, 21, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Nền mô phỏng vũ trụ hoặc Game AAA */
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 90, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(5, 6, 8, 0.85); /* Phủ mờ nền ảnh cho dễ nhìn form */
            z-index: 0;
        }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Hiệu ứng viền trên thẻ */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.8;
        }

        .logo-box { margin-bottom: 32px; }
        .logo-box img {
            width: 64px; height: 64px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 16px;
        }
        .logo-box h2 {
            margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px;
        }
        .logo-box h2 span { color: var(--primary); }

        /* Khối thông báo (Alerts) */
        .alert {
            padding: 14px; border-radius: 12px; margin-bottom: 24px;
            font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.12); color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12); color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Form Inputs */
        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label {
            display: block; font-size: 12.5px; color: var(--text-muted);
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .input-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; border-radius: 12px; font-size: 14.5px; font-family: inherit;
            transition: all 0.3s ease; outline: none;
        }
        .input-group input:focus {
            background: rgba(255, 90, 0, 0.05);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.15);
        }

        .forgot-pass-link {
            display: block; text-align: right; margin-top: -12px; margin-bottom: 24px;
            font-size: 13px; font-weight: 600; color: var(--text-muted); text-decoration: none; transition: 0.2s;
        }
        .forgot-pass-link:hover { color: var(--primary); }

        /* Nút Submit */
        .btn-submit {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff5a00, #ff7a00);
            color: #fff; border: none; border-radius: 12px;
            font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 24px var(--primary-glow);
        }
        .btn-submit:hover {
            transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 90, 0, 0.6);
        }

        /* Nút Google */
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            background-color: #fff; color: #111; padding: 14px;
            border: none; border-radius: 12px; text-decoration: none;
            font-size: 14.5px; font-weight: 700; transition: 0.3s; width: 100%;
            margin-top: 16px; box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-google:hover {
            background-color: #f1f5f9; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.2);
        }

        .divider {
            display: flex; align-items: center; text-align: center;
            color: #475569; font-size: 12px; font-weight: 700; text-transform: uppercase; margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .footer-link { margin-top: 32px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 700; transition: 0.2s; }
        .footer-link a:hover { color: #ff7a00; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="logo-box">
            <img th:src="@{/images/logo.jpg}" alt="Panthera Logo" onerror="this.src='https://placehold.co/100x100/ff5a00/ffffff?text=P'">
            <h2>PANTHERA<span>.ID</span></h2>
        </div>

        <div th:if="${param.error}" class="alert alert-error">⚠️ Sai tên đăng nhập hoặc mật khẩu!</div>
        <div th:if="${param.logout}" class="alert alert-success">✅ Đã đăng xuất an toàn.</div>
        <div th:if="${param.registered}" class="alert alert-success">🎉 Đăng ký thành công! Hãy đăng nhập.</div>
        <div th:if="${param.resetSuccess}" class="alert alert-success">🔒 Đổi mật khẩu thành công! Hãy đăng nhập lại.</div>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập tài khoản Panthera ID" required autocomplete="username">
            </div>
            <div class="input-group" style="margin-bottom: 12px;">
                <label>Mật khẩu</label>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <a th:href="@{/forgot-password}" class="forgot-pass-link">Quên mật khẩu?</a>

            <button type="submit" class="btn-submit">BẮT ĐẦU NGAY</button>
        </form>

        <div class="divider">Hoặc kết nối với</div>

        <a href="/oauth2/authorization/google" class="btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 20px;">
            Đăng nhập bằng Google
        </a>

        <div class="footer-link">
            Mới gia nhập? <a th:href="@{/register}">Tạo Panthera ID ngay</a>
        </div>
    </div>
</div>

</body>
</html>
