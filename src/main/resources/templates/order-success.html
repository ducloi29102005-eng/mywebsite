<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Thành Công | Panthera</title>
    <style>
        :root {
            --primary: #ff5a00;
            --primary-hover: #e04e00;
            --bg-dark: #080808;
            --card-bg: #121212;
            --border: #222222;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .success-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            max-width: 620px;
            width: 100%;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(0, 200, 83, 0.15);
            border: 2px solid #00c853;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 38px;
            color: #00c853;
        }
        h1 { margin: 0 0 10px; font-size: 26px; text-transform: uppercase; letter-spacing: 0.5px; }
        p.subtitle { color: #888; margin: 0 0 30px; font-size: 14.5px; }

        .order-meta {
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .meta-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: #ccc; }
        .meta-row:last-child { margin-bottom: 0; padding-top: 10px; border-top: 1px dashed var(--border); }
        .meta-row strong { color: var(--primary); }

        .btn-group { display: flex; gap: 14px; }
        .btn {
            flex: 1;
            padding: 13px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            transition: 0.25s;
        }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .btn-secondary:hover { background: #242424; color: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">✓</div>
    <h1>Thanh Toán Thành Công!</h1>
    <p class="subtitle">Đơn hàng của bạn đã được tiếp nhận và lưu vào hệ thống cơ sở dữ liệu.</p>

    <div class="order-meta">
        <div class="meta-row">
            <span>Mã đơn hàng:</span>
            <span th:text="${order.id}">67d...</span>
        </div>
        <div class="meta-row">
            <span>Trạng thái:</span>
            <span style="color: #00c853; font-weight: 700;">ĐÃ THANH TOÁN</span>
        </div>
        <div class="meta-row">
            <span>Số loại vật phẩm:</span>
            <span th:text="${order.items.size()} + ' sản phẩm'">2</span>
        </div>
        <div class="meta-row">
            <span>Tổng số tiền:</span>
            <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'POINT')} + ' đ'">3.390.000 đ</strong>
        </div>
    </div>

    <div class="btn-group">
        <a th:href="@{/orders}" class="btn btn-secondary">Xem lịch sử mua hàng</a>
        <a th:href="@{/shop}" class="btn btn-primary">Tiếp tục mua sắm</a>
    </div>
</div>

</body>
</html>
