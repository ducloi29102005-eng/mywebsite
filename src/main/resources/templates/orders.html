<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đơn Hàng | Panthera</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff5a00; --bg-dark: #07080a; --surface: #14171f; --border: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-secondary: #cbd5e1; }
        body { margin: 0; font-family: 'Be Vietnam Pro', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 0 5%; height: 80px; background: rgba(7, 8, 10, 0.8); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 22px; }
        .brand-logo img { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--border); }
        .brand-logo span { color: var(--primary); }
        .nav-links a { text-decoration: none; color: var(--text-secondary); font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 24px; }
        .page-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 15px; }

        .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
        .order-header { padding: 15px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        .status { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; }
        .status.PENDING { color: #facc15; background: rgba(234, 179, 8, 0.1); }
        .status.PACKED { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .status.SHIPPING { color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .status.COMPLETED { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .status.CANCELLED { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        .order-body { padding: 20px 24px; }
        .item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
        .item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-info img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
        .item-info h5 { margin: 0 0 5px 0; font-size: 15px; }
        .item-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }
        .item-price { font-weight: 700; color: #34d399; }

        .order-footer { padding: 20px 24px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .total { font-size: 20px; font-weight: 800; color: var(--primary); }

        .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: 0.3s; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-cancel:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.1); }
        .btn-receive { background: #22c55e; color: #000; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-receive:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); }
        .action-form { margin: 0; }
    </style>
</head>
<body>

<header class="navbar">
    <a th:href="@{/}" class="brand-logo"><img th:src="@{/images/logo.jpg}"><div>PANTHERA<span>.GAMES</span></div></a>
    <div class="nav-links"><a th:href="@{/shop}">← Quay lại Cửa hàng</a></div>
</header>

<main class="container">
    <h1 class="page-title">LỊCH SỬ ĐƠN HÀNG CỦA BẠN</h1>

    <div th:if="${orders.empty}" style="text-align: center; padding: 60px; background: var(--surface); border-radius: 16px;">
        <h3 style="color: var(--text-secondary); margin-bottom: 20px;">Bạn chưa có đơn hàng nào.</h3>
        <a th:href="@{/shop}" style="color: var(--primary); font-weight: bold; text-decoration: none;">Khám phá sản phẩm ngay</a>
    </div>

    <div th:each="order : ${orders}" class="order-card">
        <div class="order-header">
            <div>
                <strong th:text="'Đơn Hàng #' + ${#strings.substring(order.id, order.id.length() - 6, order.id.length()).toUpperCase()}">#123</strong>
                <span style="color: var(--text-secondary); margin-left: 10px; font-size: 13px;" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">Date</span>
            </div>
            <!-- Trạng thái đơn -->
            <span th:class="'status ' + ${order.status}" th:text="${order.status == 'PENDING' ? 'Đang chờ xác nhận' : (order.status == 'PACKED' ? 'Đang lấy hàng' : (order.status == 'SHIPPING' ? 'Đang giao hàng' : (order.status == 'COMPLETED' ? 'Giao hàng thành công' : 'Đã hủy')))}">PENDING</span>
        </div>

        <div class="order-body">
            <div th:each="item : ${order.items}" class="item">
                <div class="item-info">
                    <img th:src="${item.image}" alt="Item">
                    <div>
                        <h5 th:text="${item.name}">Tên SP</h5>
                        <p th:text="'Phân loại: ' + ${item.size} + ' | Số lượng: ' + ${item.quantity}">Size M | SL: 1</p>
                    </div>
                </div>
                <div class="item-price" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'POINT', 0, 'POINT')} + ' đ'">0 đ</div>
            </div>
        </div>

        <div class="order-footer">
            <div>
                <span style="color: var(--text-secondary); font-size: 14px;">Thành tiền: </span>
                <span class="total" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'POINT')} + ' đ'">0 đ</span>
            </div>

            <!-- LOGIC HIỂN THỊ NÚT TƯƠNG TÁC -->
            <div>
                <!-- Nút Hủy (Chỉ hiện khi PENDING) -->
                <form th:if="${order.status == 'PENDING'}" th:action="@{/orders/action}" method="post" class="action-form">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <input type="hidden" name="action" value="CANCEL">
                    <button type="submit" class="btn btn-cancel" onclick="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này?');">Hủy Đơn Hàng</button>
                </form>

                <!-- Ẩn nút khi PACKED (Không cho hủy) -->
                <span th:if="${order.status == 'PACKED'}" style="color: var(--text-secondary); font-size: 13px;">Shop đang đóng gói, không thể hủy.</span>

                <!-- Nút Xác Nhận Đã Nhận (Chỉ hiện khi SHIPPING) -->
                <form th:if="${order.status == 'SHIPPING'}" th:action="@{/orders/action}" method="post" class="action-form">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <input type="hidden" name="action" value="COMPLETE">
                    <button type="submit" class="btn btn-receive" onclick="return confirm('Xác nhận bạn đã nhận được hàng nguyên vẹn?');">Đã Nhận Được Hàng</button>
                </form>

                <span th:if="${order.status == 'COMPLETED'}" style="color: #22c55e; font-weight: 700;">Cảm ơn bạn đã mua sắm!</span>
            </div>
        </div>
    </div>
</main>

</body>
</html>
