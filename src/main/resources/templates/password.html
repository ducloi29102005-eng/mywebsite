<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi Mật Khẩu | Panthera</title>
    <style>
        :root { --primary: #ff5a00; --bg-dark: #050505; --surface: #121212; --border: #2a2a2a; --text-main: #ffffff; --text-muted: #888888; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 30px 20px; box-sizing: border-box; }
        .sidebar .logo { width: 160px; display: block; margin: 0 auto 40px auto; }
        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-menu li a { display: flex; align-items: center; padding: 15px 20px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-weight: 500; }
        .nav-menu li a.active { background: rgba(255, 90, 0, 0.1); color: var(--primary); border-left: 4px solid var(--primary); }
        .main-content { flex: 1; padding: 50px; }
        .content-header { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .form-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; max-width: 500px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: #000; border: none; padding: 14px; font-weight: bold; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .alert-error { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; padding: 12px; border-radius: 6px; border: 1px solid #ff4d4d; margin-bottom: 20px; }
    </style>
</head>
<body>
<aside class="sidebar">
    <img th:src="@{/images/logo.jpg}" alt="Logo" class="logo">
    <ul class="nav-menu">
        <li><a th:href="@{/profile}">Hồ sơ của bạn</a></li>
        <li><a th:href="@{/profile/games}">Trò chơi đã liên kết</a></li>
        <li><a th:href="@{/profile/security}" class="active">Phương thức đăng nhập</a></li>
        <li style="margin-top: 50px;"><a th:href="@{/logout}" style="color: #ff4d4d;">Đăng xuất</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="content-header">
        <h2>ĐỔI MẬT KHẨU</h2>
    </div>
    <div class="form-container">
        <div th:if="${error}" class="alert-error" th:text="${error}">Lỗi đổi mật khẩu</div>

        <form th:action="@{/profile/security/password}" method="post">
            <div class="form-group">
                <label>Mật khẩu hiện tại</label>
                <input type="password" name="oldPassword" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" required>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn-save">XÁC NHẬN ĐỔI</button>
            <a th:href="@{/profile/security}" style="display: block; text-align: center; margin-top: 15px; color: var(--text-muted); text-decoration: none; font-size: 13px;">Quay lại</a>
        </form>
    </div>
</main>
</body>
</html>
