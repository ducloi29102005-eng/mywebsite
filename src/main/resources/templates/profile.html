<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Tài Khoản | Panthera</title>
    <style>
        :root { --primary:#ff5a00; --bg-dark: #050505; --surface: #121212; --border: #2a2a2a; --text-main: #ffffff; --text-muted: #888888; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar .logo { width: 160px; height: 160px; display: block; margin: 0 auto 40px auto; border-radius: 50%; object-fit: cover; }
        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-menu li a { display: flex; align-items: center; padding: 15px 20px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-weight: 500; transition: all 0.3s; }
        .nav-menu li a:hover { background: rgba(212, 175, 55, 0.05); color: var(--primary); }
        .nav-menu li a.active { background: rgba(212, 175, 55, 0.1); color: var(--primary); border-left: 4px solid var(--primary); }
        .main-content { flex: 1; padding: 50px; background: var(--bg-dark); }
        .content-header { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .content-header h2 { margin: 0; font-weight: 400; font-size: 24px; }
        .form-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; max-width: 700px; }
        .alert-success { background: rgba(212, 175, 55, 0.1); color: var(--primary); padding: 15px; border-radius: 8px; border: 1px solid var(--primary); margin-bottom: 25px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: all 0.3s; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
        input[readonly] { color: var(--text-muted); cursor: not-allowed; }
        .btn-save { background: var(--primary); color: #000; border: none; padding: 15px 30px; font-size: 14px; font-weight: bold; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-save:hover { background: #e5c048; }
    </style>
</head>
<body>
<aside class="sidebar">
    <img th:src="@{/images/logo.jpg}" alt="Panthera Logo" class="logo">
    <ul class="nav-menu">
        <li><a th:href="@{/profile}" class="active">Hồ sơ của bạn</a></li>
        <li><a th:href="@{/profile/games}">Trò chơi đã liên kết</a></li>
        <li><a th:href="@{/profile/security}">Cài đặt tài khoản</a></li>
        <li style="margin-top: 20px;" th:if="${user != null and user.role == 'ADMIN'}">
            <a th:href="@{/admin/dashboard}" style="color: #ff9900; border-left: 2px solid #ff9900; padding-left: 15px;">Trang Quản Trị</a>
        </li>
        <li style="margin-top: 50px;"><a th:href="@{/logout}" style="color: #ff4d4d;">Đăng xuất</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="content-header"><h2>THÔNG TIN TÀI KHOẢN</h2></div>

    <div class="form-container">
        <div th:if="${param.success}" class="alert-success">Cập nhật thông tin thành công!</div>

        <form th:action="@{/profile/edit}" th:object="${profile}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" th:value="${user.userId}" name="userId" readonly style="color: #ff5a00; font-family: monospace;">
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" th:value="${user.username}" readonly>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Họ và Tên</label><input type="text" th:field="*{fullName}"></div>
                <div class="form-group"><label>Ngày sinh</label><input type="date" th:field="*{dateOfBirth}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Số điện thoại</label><input type="text" th:field="*{phoneNumber}"></div>
                <div class="form-group"><label>Địa chỉ</label><input type="text" th:field="*{address}"></div>
            </div>
            <button type="submit" class="btn-save">LƯU THAY ĐỔI</button>
        </form>
    </div>
</main>
</body>
</html>
