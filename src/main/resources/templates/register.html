<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký | Panthera</title>
    <style>
        body {
            margin: 0; background-color: #050505; color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .auth-card {
            background: #121212; border: 1px solid #2a2a2a; border-radius: 16px;
            padding: 40px; width: 100%; max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
        }
        .logo { width: 140px; margin-bottom: 25px; }
        h3 { margin-top: 0; color: #d4af37; font-weight: 400; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333;
            color: #fff; border-radius: 8px; box-sizing: border-box; transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
        .btn-submit {
            width: 100%; padding: 15px; background: transparent; color: #d4af37;
            border: 1px solid #d4af37; border-radius: 8px; font-weight: bold; font-size: 15px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #d4af37; color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .footer-link { margin-top: 25px; font-size: 14px; color: #888; }
        .footer-link a { color: #d4af37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="auth-card">
    <img th:src="@{/images/logo.jpg}" alt="Panthera Logo" class="logo">
    <h3>Tạo Tài Khoản Mới</h3>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="input-group">
            <label>Tên đăng nhập</label>
            <input type="text" th:field="*{username}" placeholder="Chọn tên tài khoản" required>
        </div>
        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" placeholder="Tạo mật khẩu" required>
        </div>
        <button type="submit" class="btn-submit">Đăng Ký Mở Tài Khoản</button>
    </form>

    <div class="footer-link">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
    </div>
</div>
</body>
</html>
