<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lại Mật Khẩu | Panthera</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .page-title {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .form-card {
            background-color: #121212;
            border-radius: 8px;
            padding: 35px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .input-group {
            margin-bottom: 22px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: #000;
            border: 1px solid #1a1a1a;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ff6600;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #ff5722;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #ff784e;
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="page-title">ĐẶT LẠI MẬT KHẨU</div>

    <div class="form-card">
        <form th:action="@{/reset-password}" method="post">
            <!-- THẺ ẨN CHỨA EMAIL: Rất quan trọng để không bị lỗi 400 Bad Request -->
            <input type="hidden" name="email" th:value="${email}" />

            <div class="input-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" required />
            </div>

            <button type="submit" class="btn-submit">XÁC NHẬN ĐỔI</button>
        </form>
    </div>
</div>
</body>
</html>
