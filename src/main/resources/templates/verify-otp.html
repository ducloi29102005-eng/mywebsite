<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực OTP | Panthera</title>
    <style>
        body {
            margin: 0; background-color: #050505; color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .main-container { width: 100%; max-width: 450px; padding: 20px; }
        .page-title { font-size: 24px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        .form-card { background-color: #121212; border-radius: 8px; padding: 35px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        .alert-error {
            background-color: rgba(255, 77, 77, 0.1); color: #ff4d4d;
            border: 1px solid #ff4d4d; padding: 12px; border-radius: 4px;
            margin-bottom: 20px; font-size: 13px;
        }

        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .input-group input {
            width: 100%; padding: 14px; background-color: #000;
            border: 1px solid #1a1a1a; color: #fff; border-radius: 4px;
            box-sizing: border-box; font-size: 14px; transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #ff6600; }

        .btn-submit {
            width: 100%; padding: 16px; background-color: #ff5722; color: #000;
            border: none; border-radius: 6px; font-weight: bold; font-size: 14px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #ff784e; }

        .back-link { display: block; text-align: center; margin-top: 25px; color: #888; text-decoration: none; font-size: 13px; transition: 0.3s; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="page-title">XÁC THỰC OTP</div>

    <div class="form-card">
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- ĐƯỜNG DẪN ACTION ĐÃ ĐƯỢC SỬA LẠI THÀNH /verify-otp -->
        <form th:action="@{/verify-otp}" method="post">

            <!-- Thẻ ẩn lưu giữ email -->
            <input type="hidden" name="email" th:value="${email}" />

            <div class="input-group">
                <label>Mã OTP (6 số từ Email)</label>
                <input type="text" name="otpCode" required autocomplete="off" maxlength="6" />
            </div>

            <button type="submit" class="btn-submit">XÁC NHẬN OTP</button>
        </form>

        <a th:href="@{/login}" class="back-link">Hủy và quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
